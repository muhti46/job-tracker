<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications | Job Tracker</title>
  <link rel="stylesheet" href="applications.css">
</head>
<body>
  <main class="board-shell">
    <header class="board-header">
      <div>
        <p class="eyebrow">CAREER WORKSPACE</p>
        <h1>Applications</h1>
      </div>
      <div class="header-actions"><span id="total-count" class="total-count">0 jobs</span><a class="new-link" href="popup.html">+ Save from LinkedIn</a></div>
    </header>
    <section class="board-toolbar">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search company, role, location..." aria-label="Search applications"></label>
      <label class="sort-box">Sort by <select id="sort-select" aria-label="Sort applications"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="company">Company</option><option value="title">Job title</option></select></label>
    </section>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    <section id="board" class="board" aria-live="polite"></section>
  </main>
  <div id="job-modal" class="job-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <section class="modal-panel">
      <button class="modal-close" type="button" data-action="close-modal" aria-label="Close">&times;</button>
      <header class="modal-header"><p id="modal-company" class="modal-company"></p><h2 id="modal-title">Edit application</h2><p id="modal-subtitle" class="modal-subtitle"></p></header>
      <nav class="modal-tabs" aria-label="Application sections"><button class="active" type="button" data-tab="details">ⓘ Details</button><button type="button" data-tab="description">▤ Description</button><button type="button" data-tab="contacts">♙ Contacts</button><button type="button" data-tab="notes">✎ Notes</button><button type="button" data-tab="timeline">◷ Timeline</button></nav>
      <form id="modal-form" class="modal-form">
        <section class="modal-tab-panel active" data-panel="details"><div class="modal-grid"><label>Job title<input name="title" required></label><label>Company<input name="company"></label><label>Location<input name="location"></label><label>Work arrangement<input name="workType"></label><label>Salary<input name="salary"></label><label>Application status<select name="status"><option value="applied">Applied</option><option value="interview">Interviewing</option><option value="offer">Offer</option><option value="rejected">Rejected</option></select></label></div></section>
        <section class="modal-tab-panel" data-panel="description"><label>Job description<textarea name="description" rows="12"></textarea></label></section>
        <section class="modal-tab-panel" data-panel="contacts"><div class="contacts-heading"><div><h3>Contacts</h3><p>Manage recruiters, hiring managers, and your key contacts.</p></div><button id="add-contact-button" class="add-contact-button" type="button">+ Add contact</button></div><div id="contacts-list" class="contacts-list"></div><div id="contact-form" class="contact-form hidden"><div class="modal-grid"><label>Name<input name="contactName" placeholder="Contact name"></label><label>Position<input name="contactPosition" placeholder="Position"></label><label>Company<input name="contactCompany" placeholder="Company name"></label><label>Email<input name="contactEmail" type="email" placeholder="Email address"></label><label>Phone<input name="contactPhone" placeholder="Phone number"></label><label>LinkedIn<input name="contactLinkedin" placeholder="LinkedIn URL"></label></div><label>Contact notes<textarea name="contactNotes" rows="4" placeholder="Notes about this contact"></textarea><div class="contact-form-actions"><button id="cancel-contact-button" class="modal-secondary" type="button">Cancel</button><button id="save-contact-button" class="modal-primary" type="button">Add contact</button></div></div></section>
        <section class="modal-tab-panel" data-panel="notes"><label>Notes<textarea name="notes" rows="12" placeholder="Add notes, contacts, follow-up dates, interview details..."></textarea></label></section>
        <section class="modal-tab-panel" data-panel="timeline"><div id="modal-timeline" class="timeline-copy"></div></section>
        <footer class="modal-footer"><button class="modal-secondary" type="button" data-action="close-modal">Cancel</button><button class="modal-primary" type="submit">Save changes</button></footer>
      </form>
    </section>
  </div>
  <div id="contact-modal" class="job-modal hidden" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
    <div class="modal-backdrop" data-action="close-contact-modal"></div>
    <section class="contact-modal-panel">
      <header class="contact-modal-header"><h2 id="contact-modal-title">Add Contact</h2><button class="modal-close" type="button" data-action="close-contact-modal" aria-label="Close">&times;</button></header>
      <form id="contact-modal-form" class="contact-modal-form">
        <label>Name<input name="name" placeholder="Contact's Name"></label>
        <label>Position<input name="position" placeholder="Position"></label>
        <div class="modal-grid"><label>Company<input name="company" placeholder="Company Name"></label><label>Email<input name="email" type="email" placeholder="Email Address"></label><label>Phone Number<input name="phone" placeholder="Phone Number"></label><label>LinkedIn<input name="linkedin" placeholder="LinkedIn URL"></label></div>
        <label>Link Job<input name="job" readonly></label>
        <label>Contact Notes<textarea name="notes" rows="5" placeholder="Notes about this contact"></textarea></label>
        <footer class="modal-footer"><button class="modal-secondary" type="button" data-action="close-contact-modal">Cancel</button><button class="modal-primary" type="submit">Add Contact</button></footer>
      </form>
    </section>
  </div>
  <script src="applications.js"></script>
</body>
</html>
